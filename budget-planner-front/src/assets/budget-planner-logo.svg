<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Icon: pie chart (camembert 50/30/20) inside a rounded square badge -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="#003366"/>
    <!-- pie chart, centered at 60,60, radius 38 -->
    <g transform="translate(60,60)">
      <!-- Slice 1: Dépenses essentielles - 50% - red, starts at top (-90deg) -->
      <path d="M0,0 L0,-38 A38,38 0 0,1 38,0 A38,38 0 0,1 0,38 Z" fill="#C00000"/>
      <!-- Slice 2: Loisirs - 30% - blue -->
      <path d="M0,0 L0,38 A38,38 0 0,1 -36.1,-11.7 Z" fill="#0070C0"/>
      <!-- Slice 3: Épargnes - 20% - green -->
      <path d="M0,0 L-36.1,-11.7 A38,38 0 0,1 0,-38 Z" fill="#83E28E"/>
      <!-- center hole for donut effect -->
      <circle cx="0" cy="0" r="15" fill="#003366"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(160,0)">
    <text x="0" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Budget</text>
    <text x="0" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Planner</text>
  </g>
</svg>
